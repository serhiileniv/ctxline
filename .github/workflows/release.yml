# Publishes the binaries that install.sh downloads. Tag and push to release:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-latest
            test: false          # cross-compiled from arm64: cannot run the tests
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            test: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            test: true
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup update stable && rustup target add ${{ matrix.target }}

      # Static musl builds, so one Linux binary covers every distro.
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          tar -czf "ctxline-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" ctxline

      - uses: actions/upload-artifact@v5
        with:
          name: ctxline-${{ matrix.target }}
          path: ctxline-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    # A manual run just builds and keeps the artifacts; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # install.sh verifies against this file, so the names in it must match the
      # asset names exactly -- hence the bare basenames.
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$tag" --generate-notes
          fi
